<style>
        body { font-family: 'Inter', sans-serif; background-color: #f9f9ff; }

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.5);
        }
        .dropzone-active {
            border-color: #0066ff;
            background-color: #f0f3ff;

<body class="text-on-surface bg-background">
<!-- Sidebar (Desktop Navigation) -->
<aside class="fixed left-0 top-0 h-full w-[240px] bg-surface-container-low border-r border-outline-variant hidden md:flex flex-col z-50">
<div class="p-6">
<span class="font-headline-md text-headline-md font-bold text-primary">VideoManual AI</span>
</div>
<nav class="flex-1 px-4 space-y-2">
<!-- Mapping Top-Level Nav from JSON logic -->
<a class="flex items-center gap-3 px-4 py-3 rounded-full text-on-surface-variant hover:bg-surface-variant transition-colors" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label-md text-label-md">ホーム</span>
</a>
<a class="flex items-center gap-3 px-5 py-3 rounded-full bg-secondary-container text-on-secondary-container" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-label-md text-label-md">作成</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 rounded-full text-on-surface-variant hover:bg-surface-variant transition-colors" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label-md text-label-md">マイページ</span>
</a>
</nav>
<div class="p-6 border-t border-outline-variant">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center">
<span class="text-on-primary-fixed font-bold text-xs">JD</span>
</div>
<div class="flex flex-col">
<span class="text-label-md font-bold">User Name</span>
<span class="text-[10px] text-on-surface-variant">Pro Plan</span>
</div>
</div>
</div>
</aside>
<!-- Main Content Canvas -->
<main class="md:ml-[240px] min-h-screen flex flex-col relative">
<!-- TopAppBar Anchor -->
<header class="flex justify-between items-center w-full px-margin-tablet h-[64px] z-50 bg-surface">
<div class="flex items-center gap-4">
<button class="p-2 hover:opacity-80 active:scale-95 transition-transform text-primary">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary">マニュアル作成</h1>
</div>
<div class="flex items-center gap-4">
<button class="px-6 py-2 rounded-full font-label-md text-label-md text-primary border border-primary hover:bg-surface-container transition-colors">
                    下書き保存
                </button>
<button class="px-6 py-2 rounded-full font-label-md text-label-md bg-primary text-on-primary hover:opacity-90 active:scale-95 transition-transform shadow-md">
                    保存
                </button>
</div>
</header>
<section class="flex-1 p-margin-tablet lg:p-12 max-w-5xl mx-auto w-full">
<!-- Hero Content / Introduction -->
<div class="mb-stack-lg space-y-2">
<h2 class="font-headline-lg text-headline-lg text-on-surface">新しいマニュアルを作成</h2>
<p class="text-body-lg text-on-surface-variant max-w-2xl">
                    動画をアップロードし、AIへの指示を入力するだけで、構造化された高精度なステップバイステップ・マニュアルを自動生成します。
                </p>
</div>
<!-- Bento-style Layout for Creation -->
<div class="grid grid-cols-1 gap-stack-lg">
<!-- Large Central Upload Dropzone -->
<div class="relative group cursor-pointer border-2 border-dashed border-outline-variant bg-white rounded-xl p-12 flex flex-col items-center justify-center transition-all duration-300 hover:border-primary hover:bg-surface-container-low min-h-[400px]" id="dropzone">
<div class="absolute inset-0 overflow-hidden rounded-xl opacity-5 pointer-events-none">

</div>
<div class="relative z-10 flex flex-col items-center text-center">
<div class="w-20 h-20 bg-primary-container rounded-full flex items-center justify-center mb-stack-md group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-4xl text-on-primary-container">cloud_upload</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-2">動画ファイルをドラッグ＆ドロップ</h3>
<p class="text-body-sm text-on-surface-variant mb-stack-md">または、コンピューターからファイルを選択してください</p>
<div class="flex gap-2">
<span class="px-3 py-1 bg-surface-container-highest rounded text-label-sm text-on-surface-variant">MP4</span>
<span class="px-3 py-1 bg-surface-container-highest rounded text-label-sm text-on-surface-variant">MOV</span>
<span class="px-3 py-1 bg-surface-container-highest rounded text-label-sm text-on-surface-variant">最大 2GB</span>
</div>
</div>
<input accept="video/*" class="hidden" id="fileInput" type="file"/>
</div>
<!-- AI Instructions Area -->
<div class="bg-white rounded-xl p-8 border border-outline-variant shadow-sm space-y-stack-md">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<h3 class="font-headline-md text-headline-md text-on-surface">AIへの指示 (プロンプト)</h3>
</div>
<div class="relative">
<textarea class="w-full min-h-[160px] p-4 rounded-lg border border-outline focus:border-primary focus:ring-2 focus:ring-primary-container bg-surface-bright text-body-lg resize-none transition-all" placeholder="例：この動画から、新入社員向けのPCセットアップ手順書を作成してください。専門用語は避け、各ステップに注意点を1つ含めるようにしてください。"></textarea>
<!-- AI Suggestion Chips -->
<div class="mt-4 flex flex-wrap gap-2">
<button class="px-4 py-1.5 bg-secondary-fixed text-on-secondary-fixed rounded-full font-label-md text-label-md hover:opacity-80 transition-opacity">
                                専門用語を解説
                            </button>
<button class="px-4 py-1.5 bg-secondary-fixed text-on-secondary-fixed rounded-full font-label-md text-label-md hover:opacity-80 transition-opacity">
                                簡潔な要約
                            </button>
<button class="px-4 py-1.5 bg-secondary-fixed text-on-secondary-fixed rounded-full font-label-md text-label-md hover:opacity-80 transition-opacity">
                                チェックリスト形式
                            </button>
</div>
</div>
</div>
<!-- Action Bar -->
<div class="flex justify-end pt-4 pb-12">
<button class="group flex items-center gap-3 px-10 py-4 bg-primary text-on-primary rounded-full font-headline-md text-headline-md hover:opacity-95 active:scale-95 transition-all shadow-lg hover:shadow-xl" id="generateBtn">
<span>生成を開始する</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</div>
</section>
<!-- Aesthetic Decoration -->
<div class="fixed bottom-0 right-0 p-12 opacity-20 pointer-events-none hidden xl:block">
<div class="w-64 h-64 rounded-full bg-gradient-to-br from-primary to-secondary blur-3xl"></div>
</div>
</main>
<!-- Bottom Nav for Mobile (Mirroring logic) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe bg-surface shadow-[0px_-1px_0px_0px_rgba(0,0,0,0.1)]">
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label-sm text-label-sm">ホーム</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-label-sm text-label-sm">作成</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm">マイページ</span>
</a>
</nav>
<script>
        // Simple Interaction Logic
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');

        dropzone.addEventListener('click', () => fileInput.click());

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dropzone-active', 'ring-4', 'ring-primary-container');
        });

        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('dropzone-active', 'ring-4', 'ring-primary-container');
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dropzone-active', 'ring-4', 'ring-primary-container');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (file.type.startsWith('video/')) {
                // Update UI to show selected file
                dropzone.querySelector('h3').textContent = file.name;
                dropzone.querySelector('p').textContent = (file.size / (1024 * 1024)).toFixed(2) + ' MB - アップロード準備完了';
                dropzone.querySelector('.w-20').innerHTML = '<span class="material-symbols-outlined text-4xl text-on-primary-container">check_circle</span>';
                dropzone.classList.add('border-primary', 'bg-surface-container-low');
            } else {
                alert('動画ファイルを選択してください。');
            }
        }

        const generateBtn = document.getElementById('generateBtn');
        generateBtn.addEventListener('click', () => {
            generateBtn.innerHTML = `
                <div class="w-6 h-6 border-4 border-on-primary border-t-transparent rounded-full animate-spin"></div>
                <span>生成中...</span>
            `;
            generateBtn.classList.add('opacity-80', 'pointer-events-none');
            // Mock delay
            setTimeout(() => {
                alert('マニュアルの生成を開始しました。完了までしばらくお待ちください。');
                generateBtn.innerHTML = '<span>生成を開始する</span><span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>';
                generateBtn.classList.remove('opacity-80', 'pointer-events-none');
            }, 2000);
        });
    </script>
</body></html>
